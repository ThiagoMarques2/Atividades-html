<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seletores CSS 1</title>

<style>

div p{
color:red;
}

section > p{
color:blue;
}

h1 + p{
color:green;
}

h2 ~ p{
color:purple;
}

ul > li{
color:orange;
}

article span{
color:brown;
}

div > p:first-of-type{
color:pink;
}

div.galeria > img{
border:2px solid black;
}

</style>

</head>
<body>
</body>
</html>
